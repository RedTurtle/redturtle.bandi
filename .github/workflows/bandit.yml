name: Security check - Bandit

on: push

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
      # only required for workflows in private repositories
      actions: read
      contents: read
    steps:
      - name: Perform Bandit Analysis
        # v1 hardcodes Python 3.8, not available on recent runners:
        # pin to a main commit that supports the python-version input
        uses: PyCQA/bandit-action@8970b6163696044b1b81bd86df0d01a7695e65df
        with:
            targets: ./redturtle
            python-version: '3.12'
